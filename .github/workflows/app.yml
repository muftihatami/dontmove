name: app
on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Lengkapi kerangka proyek (file platform tidak di-commit)
        working-directory: app
        run: flutter create --platforms=web --project-name dontmove --org id.dontmove .
      - name: Analisis
        working-directory: app
        run: flutter pub get && flutter analyze --no-fatal-infos
      - name: Build web
        working-directory: app
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web
          retention-days: 30
