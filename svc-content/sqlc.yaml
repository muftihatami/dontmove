# G2: konfigurasi sqlc milik Layanan Konten. Hanya membaca skema Content Store,
# jadi paket contentdb secara harfiah tidak punya tipe untuk tabel Vault mana pun.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/content"
    queries: "queries/content"
    gen:
      go:
        package: "contentdb"
        out: "internal/contentdb"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: { import: "github.com/google/uuid", type: "NullUUID" }
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type: { type: "time.Time", pointer: true }
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type: { type: "time.Time", pointer: true }
